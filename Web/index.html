<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <!-- No href at load time: assets resolve relative to the page (mdpreview://app/ on macOS,
       https://app.mdpreview/ on Windows). preview.js sets href per document for images/links. -->
  <base id="doc-base">
  <link rel="stylesheet" href="github-markdown.css">
  <link rel="stylesheet" href="hljs-github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="hljs-github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="preview.css">
</head>
<body>
  <article id="content" class="markdown-body"></article>
  <script src="marked.umd.js"></script>
  <script src="highlight.min.js"></script>
  <script src="mermaid.min.js"></script>
  <script src="preview.js"></script>
</body>
</html>
